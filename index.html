  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('axycore_theme');
          var isDark = stored === 'dark';
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.dataset.theme = 'dark';
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.dataset.theme = 'light';
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        if (typeof window === 'undefined' || !window.WebSocket) return;
        var NativeWS = window.WebSocket;
        function PatchedWebSocket(url, protocols) {
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
            return {
              url: String(url || ''),
              readyState: 1,
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              protocol: protoStr,
              extensions: '',
              bufferedAmount: 0,
              binaryType: 'blob',
              send: function () {},
              close: function () {},
              addEventListener: function (type, fn) {
                if (type === 'open' && typeof fn === 'function') {
                  setTimeout(function () { fn({ type: 'open' }); }, 0);
                }
              },
              removeEventListener: function () {},
              dispatchEvent: function () { return true; }
            };
          }
          return protocols !== undefined ? new NativeWS(url, protocols) : new NativeWS(url);
        }
        PatchedWebSocket.prototype = NativeWS.prototype;
        PatchedWebSocket.CONNECTING = NativeWS.CONNECTING;
        PatchedWebSocket.OPEN = NativeWS.OPEN;
        PatchedWebSocket.CLOSING = NativeWS.CLOSING;
        PatchedWebSocket.CLOSED = NativeWS.CLOSED;
        window.WebSocket = PatchedWebSocket;
      })();
    </script>
